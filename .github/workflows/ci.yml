name: TeX checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check-engine: pdftex
            engine: pdflatex
          - check-engine: xetex
            engine: xelatex
          - check-engine: luatex
            engine: lualatex
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-xetex texlive-luatex texlive-fonts-recommended
      - name: Regression contracts
        run: l3build check -e ${{ matrix.check-engine }}
      - name: Examples and guide
        run: python3 scripts/compile.py --engine ${{ matrix.engine }}
      - name: Executable guide examples
        run: python3 scripts/check_manual.py --engine ${{ matrix.engine }}
      - name: Release file checks
        run: python3 scripts/release.py check
      - name: Release gate regressions
        run: python3 scripts/test_release.py
